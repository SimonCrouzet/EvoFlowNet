[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evoflownet"
version = "0.1.0.dev0"
description = "GFlowNets for in-silico directed evolution: sampling diverse, feasible, high-fitness protein variants."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Simon Crouzet" }]
keywords = [
    "gflownet",
    "directed-evolution",
    "protein-engineering",
    "fitness-landscape",
    "generative-models",
    "active-learning",
    "multi-objective-optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "hydra-core>=1.3",
]

[project.optional-dependencies]
# Experiment tracking. Kept optional so the library, its tests and CI never
# require an account or API key: the default tracker writes to the console.
wandb = ["wandb>=0.17"]

# Protein language model oracles (ESM-2). Heavy and GPU-oriented; the default
# landscapes are closed-form or table-lookup and need none of this.
plm = ["transformers>=4.44"]

[project.urls]
Homepage = "https://github.com/SimonCrouzet/evoflownet"
Documentation = "https://simoncrouzet.github.io/evoflownet"
Repository = "https://github.com/SimonCrouzet/evoflownet"
Issues = "https://github.com/SimonCrouzet/evoflownet/issues"

[project.scripts]
evoflownet = "evoflownet.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evoflownet"]

# Development dependencies, managed by uv. These are not part of any published
# extra: nobody installing the library from PyPI should pull in a test runner.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.uv]
# The uv cache lives on the home filesystem, but a checkout may sit on a
# different one (a mounted drive under WSL, a network share, a container bind
# mount). Hardlinks cannot cross filesystems, so uv warns and silently falls
# back to copying. Asking for copies outright keeps the output clean and the
# behaviour identical everywhere.
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TC",   # flake8-type-checking
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
]
ignore = [
    # Mathematical notation. This library implements objectives from published
    # papers, and readers check the code against the papers. Renaming `Z` to
    # `partition_function` or `L` to `sequence_length` inside a loss function
    # makes it *harder* to verify against the source, so single-capital names
    # are allowed where they mirror the reference notation.
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    # Conflicts with the formatter.
    "COM812",
    "ISC001",
    # Chosen docstring convention resolves these mutually exclusive pairs.
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",       # tests document themselves through their names
    "ANN",     # annotating every fixture adds noise, not safety
    "S101",    # assert is the entire point of a test
    "PLR2004", # magic values are how you write expected results
]
"notebooks/**" = [
    "D",
    "ANN",
    "E402",    # imports after prose cells are normal in notebooks
    "T20",     # notebooks print
]
