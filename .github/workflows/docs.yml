name: Docs

on:
  push:
    branches: [main]
  pull_request:
    # The docs are generated from docstrings in src/, so a change there can
    # break the build without anything under docs/ being touched. Narrowing
    # these paths would mean discovering that on main.
  merge_group:

# Least privilege by default. The deploy job requests what it needs and no
# other job inherits it.
permissions:
  contents: read

# A new push makes the previous build's answer irrelevant. Never cancel on main
# or in a merge queue: a deploy interrupted halfway leaves the site in a state
# nobody chose.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: Build (mkdocs strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the docs group only
        # mkdocstrings' python handler reads the source tree with griffe, which
        # parses rather than imports. So the docs build needs neither torch nor
        # the project installed -- which keeps this job at a few seconds instead
        # of pulling a 1.1GB dependency tree to render docstrings.
        #
        # --locked fails if uv.lock is out of step with pyproject.toml rather
        # than silently re-resolving, so this builds against the dependency set
        # that was actually committed.
        run: uv sync --only-group docs --locked

      - name: Build
        # mkdocs.yml sets `strict: true`, so a broken internal link or a
        # docstring reference that no longer resolves fails here rather than
        # being published. The API pages are generated from docstrings that
        # move, which is exactly the failure that needs catching.
        run: uv run mkdocs build --strict

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: site/
          retention-days: 14

      # Only the built site is a Pages artifact, and only on main. Uploading it
      # from a pull request would mean a fork could stage arbitrary content for
      # deployment.
      - name: Package for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    # Separated from the build so the elevated permissions below apply to a job
    # that runs no project code -- it only publishes an artifact the build
    # already produced.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Single aggregating gate, matching CI's. Branch protection requires this one
  # check, and a job that is skipped or cancelled still fails it -- which a
  # naive `needs` list would let through.
  docs-ok:
    name: Docs passed
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the build succeeded
        run: |
          echo "build=${{ needs.build.result }}"
          [ "${{ needs.build.result }}" = "success" ] || exit 1
