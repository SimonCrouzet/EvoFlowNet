name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify the tag matches the packaged version
        # A tag and a version that disagree produce a release nobody can
        # reproduce from source. Publishing to PyPI cannot be undone, so this
        # is checked before the build rather than noticed afterwards.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv version --short)"
          echo "tag=$tag packaged=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match version $pkg in pyproject.toml"
            exit 1
          fi

      - run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # A GitHub environment lets a required reviewer stand between a pushed tag
    # and an irreversible upload, and scopes the trusted-publishing identity.
    environment:
      name: pypi
      url: https://pypi.org/p/evoflownet
    permissions:
      id-token: write # OIDC token for trusted publishing
      attestations: write # signed provenance for the uploaded files
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        # Trusted publishing: PyPI verifies the OIDC identity of this workflow,
        # so there is no long-lived API token to store, leak or rotate.
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          attestations: true

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
          dist/*
