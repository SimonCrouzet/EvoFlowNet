# A lab-in-the-loop campaign. Override any group from the command line, e.g.
#   evoflownet campaign landscape=gb1 acquisition=ucb selector=diverse
defaults:
  - landscape: gb1
  - env: mutation
  - reward: tempered
  - policy: mlp
  - training: trajectory_balance
  - objective: trajectory_balance
  - surrogate: ensemble
  - acquisition: greedy
  - selector: topk
  - campaign: four_plates
  - tracker: console
  - _self_

# Which sampler proposes designs. "gflownet" trains against the surrogate
# proxy; the baselines are what it has to beat.
sampler: gflownet

# Seeds every stochastic component.
seed: 0

hydra:
  run:
    dir: outputs/campaign/${now:%Y-%m-%d}/${now:%H-%M-%S}
