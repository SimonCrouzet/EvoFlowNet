_target_: evoflownet.landscapes.ehrlich.EhrlichLandscape
sequence_length: 16
vocab_size: 6
n_motifs: 2
motif_length: 2
# Defaults to motif_length (the dense signal). Lower values make the reward
# sparser and, per Stanton et al., dominate difficulty.
quantization: null
max_spacing: 2
# Below 1.0, most uniformly random sequences become infeasible -- which is the
# property the benchmark exists to expose.
transition_density: 1.0
seed: 0
