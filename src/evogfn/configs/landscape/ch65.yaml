_target_: evogfn.landscapes.ch65.CH65Landscape
# The 2,610 combinations that did not clear QC on all three antigens. 6.0 is
# CH65_DETECTION_FLOOR, i.e. "indistinguishable from a non-binder" -- the
# weakest claim the data supports. Not 0.0 as on GB1: zero is off this scale
# (it would assert a 1 M dissociation constant) and would invent a cliff the
# assay never measured. Use nan to make their absence visible instead.
unmeasured_value: 6.0
force_download: false
