site_name: EvoFlowNet
site_description: >-
  GFlowNets for in-silico directed evolution: sampling diverse, feasible,
  high-fitness protein variants under a wet-lab budget.
site_url: https://simoncrouzet.github.io/evoflownet/
repo_url: https://github.com/SimonCrouzet/EvoFlowNet
repo_name: SimonCrouzet/EvoFlowNet
copyright: Copyright &copy; 2026 Simon J. Crouzet — Apache-2.0

# A link that 404s is worse than no link, and the API pages are generated from
# docstrings that move. Fail the build instead of publishing the broken page.
strict: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    # The docs are read on a laptop next to a terminal, so both schemes exist
    # and the toggle remembers which one.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Read the source tree rather than an installed copy, so the docs
          # describe the checkout being built and not whatever is on the path.
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]
            # Module docstrings in this project explain why a component exists
            # and what failure it prevents. That is the part worth reading, so
            # it is never truncated to a summary line.
            show_if_no_docstring: false
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  # Deliberately no math extension. mkdocstrings renders docstrings as
  # Markdown, and the four modules carrying equations write them as
  # reStructuredText `.. math::` blocks, which no Markdown math extension
  # picks up. Configuring one would suggest the equations render when they do
  # not. See the note on the home page.

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - The benchmark suite: benchmark.md
  - Notebooks: notebooks.md
  - What this does not show: limitations.md
  - API reference:
      - Landscapes: reference/landscapes.md
      - Environments: reference/environments.md
      - Algorithms: reference/algorithms.md
      - Campaigns: reference/loop.md
      - Benchmark: reference/benchmark.md
      - Metrics: reference/metrics.md
      - Supporting pieces: reference/support.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/simoncrouzet
